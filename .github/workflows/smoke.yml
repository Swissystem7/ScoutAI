name: smoke
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  smoke-390:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
